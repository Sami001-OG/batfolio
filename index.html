<style>
  :root{
    --black:#050608;
    --ink:#e9ecef;
    --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--black);color:var(--ink);overflow:hidden}
  body{font-family:"Oswald","Arial Narrow",Arial,sans-serif}

  .hero{position:relative;width:100%;height:100%;overflow:hidden;background:var(--black)}

  /* Blinking eyes: two stacked images, closed one toggles instantly */
  .hero-img{filter:grayscale(1) contrast(1.05);position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;user-select:none;-webkit-user-drag:none}
  #eyesClosed{opacity:0}
  #eyesClosed.on{opacity:1}

  /* Effect layers */
  canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,#fff 0%,#aaa 40%,transparent 80%);opacity:0;mix-blend-mode:screen}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to bottom,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%),
      linear-gradient(to top,rgba(0,0,0,.8) 0,rgba(0,0,0,0) 38%)}

  /* UI */
  header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 22px) clamp(18px,4vw,56px) 0}
  .logo{font-family:"Oswald",Arial,sans-serif;font-weight:400;font-size:clamp(22px,2.6vw,30px);letter-spacing:.42em;color:var(--white);text-decoration:none;line-height:1}
  nav{display:flex;gap:10px;align-items:center}
  .btn{font-family:"Oswald",sans-serif;font-weight:300;font-size:13px;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;
    color:var(--white);padding:12px 26px;border:1px solid var(--white);background:transparent;cursor:pointer;transition:color .2s,background .2s}
  .btn:hover{color:#000;background:var(--white)}
  .btn:focus-visible{outline:1px solid var(--white);outline-offset:4px}
  .btn.primary{background:var(--white);color:#000}
  .btn.primary:hover{background:transparent;color:var(--white)}

  .hero-copy{position:absolute;z-index:5;left:0;right:0;bottom:0;text-align:center;
    padding:0 20px calc(env(safe-area-inset-bottom,0px) + clamp(28px,7vh,72px))}
  .cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

  @media (max-width:640px){
    nav .btn.link{display:none}
    .btn{font-size:14px;padding:10px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    #flash{display:none}
  }
</style>

<script>
(function(){
  /* ---------- Blink ---------- */
  var closed = document.getElementById('eyesClosed');
  function setClosed(v){ closed.classList.toggle('on', v); }
  function blink(){
    setClosed(true);
    setTimeout(function(){
      setClosed(false);
      if(Math.random() < 0.25){            // occasional double blink
        setTimeout(function(){
          setClosed(true);
          setTimeout(function(){ setClosed(false); }, 130);
        }, 150);
      }
    }, 140);
    setTimeout(blink, 2800 + Math.random()*3800);
  }
  setTimeout(blink, 2200);

  /* ---------- Helpers ---------- */
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var cvs = {
    rain: document.getElementById('rain'),
    bats: document.getElementById('bats'),
    bolt: document.getElementById('bolt')
  };
  var ctx = {};
  for(var k in cvs){ ctx[k] = cvs[k].getContext('2d'); }
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    for(var k in cvs){
      cvs[k].width = W*DPR; cvs[k].height = H*DPR;
      ctx[k].setTransform(DPR,0,0,DPR,0,0);
    }
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- Black water rain ---------- */
  var drops = [];
  var count = function(){ return Math.round(Math.min(260, W*H/6500)); };
  function newDrop(initial){
    var depth = Math.random();                     // 0 far, 1 near
    return {
      x: Math.random()*(W+200) - 100,
      y: initial ? Math.random()*H : -60 - Math.random()*200,
      len: 16 + depth*46,
      speed: 650 + depth*900,
      w: 0.8 + depth*1.8,
      a: 0.35 + depth*0.55
    };
  }
  for(var i=0;i<count();i++) drops.push(newDrop(true));
  var WIND = 0.16;                                  // slight lean
  var rc = ctx.rain;
  function drawRain(dt){
    rc.clearRect(0,0,W,H);
    while(drops.length < count()) drops.push(newDrop(false));
    for(var i=0;i<drops.length;i++){
      var d = drops[i];
      d.y += d.speed*dt; d.x -= d.speed*dt*WIND;
      if(d.y - d.len > H || d.x < -120){ drops[i] = newDrop(false); continue; }
      var x2 = d.x + d.len*WIND, y2 = d.y - d.len;
      // soft glossy halo so black water reads on dark image
      rc.strokeStyle = 'rgba(210,210,210,' + (d.a*0.28) + ')';
      rc.lineWidth = d.w + 1.6;
      rc.lineCap = 'round';
      rc.beginPath(); rc.moveTo(d.x,d.y); rc.lineTo(x2,y2); rc.stroke();
      // black core
      var g = rc.createLinearGradient(d.x,d.y,x2,y2);
      g.addColorStop(0,'rgba(0,0,0,' + d.a + ')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      rc.strokeStyle = g; rc.lineWidth = d.w;
      rc.beginPath(); rc.moveTo(d.x,d.y); rc.lineTo(x2,y2); rc.stroke();
    }
  }

  /* ---------- Flying bats ---------- */
  var bats = [];
  function spawnBat(){
    var fromLeft = Math.random() < 0.5;
    var s = 0.35 + Math.random()*1.1;
    bats.push({
      x: fromLeft ? -80 : W+80,
      y: H*(0.08 + Math.random()*0.5),
      vx: (fromLeft?1:-1)*(90 + Math.random()*170)*(0.6+s*0.5),
      vy: -10 + Math.random()*20,
      s: s, ph: Math.random()*6.28, sp: 9 + Math.random()*5,
      wob: Math.random()*6.28
    });
  }
  function drawBat(c,b,t){
    var flap = Math.sin(t*b.sp + b.ph);               // -1..1
    var up = flap*0.9;
    var dir = b.vx>0 ? 1 : -1;
    c.save();
    c.translate(b.x,b.y);
    c.scale(b.s*dir,b.s);
    c.fillStyle = 'rgba(2,2,4,0.92)';
    // body
    c.beginPath(); c.ellipse(0,0,6,10,0,0,6.28); c.fill();
    c.beginPath(); c.moveTo(-4,-8); c.lineTo(-3,-15); c.lineTo(0,-10); c.lineTo(3,-15); c.lineTo(4,-8); c.fill();
    // wings (mirrored)
    for(var m=-1;m<=1;m+=2){
      c.save(); c.scale(m,1);
      c.beginPath();
      c.moveTo(4,-3);
      c.quadraticCurveTo(22,-18-up*22,46,-10-up*30);
      c.quadraticCurveTo(38,-4-up*18,34,2-up*12);
      c.quadraticCurveTo(28,-2-up*8,22,6-up*6);
      c.quadraticCurveTo(15,2-up*3,10,10);
      c.quadraticCurveTo(7,6,4,8);
      c.closePath(); c.fill();
      c.restore();
    }
    c.restore();
  }
  var nextBat = 0;
  function drawBats(dt,t){
    var c = ctx.bats; c.clearRect(0,0,W,H);
    nextBat -= dt;
    if(nextBat <= 0 && bats.length < 7){
      var n = 1 + (Math.random()<0.3 ? 2 : 0);
      for(var i=0;i<n;i++) spawnBat();
      nextBat = 2 + Math.random()*4;
    }
    for(var i=bats.length-1;i>=0;i--){
      var b = bats[i];
      b.x += b.vx*dt;
      b.y += (b.vy + Math.sin(t*2 + b.wob)*28)*dt;
      if(b.x < -140 || b.x > W+140){ bats.splice(i,1); continue; }
      drawBat(c,b,t);
    }
  }

  /* ---------- Lightning ---------- */
  var flash = document.getElementById('flash');
  var bc = ctx.bolt;
  var boltPaths = [], boltLife = 0;
  function makeBolt(x,y,ang,len,w,out){
    var pts = [[x,y]], segs = Math.max(6, Math.floor(len/28));
    for(var i=0;i<segs;i++){
      ang += (Math.random()-0.5)*0.9;
      x += Math.sin(ang)*len/segs; y += Math.cos(ang)*len/segs;
      pts.push([x,y]);
      if(w>1.4 && Math.random()<0.16){
        makeBolt(x,y,ang+(Math.random()<0.5?-1:1)*(0.5+Math.random()*0.6),len*0.4,w*0.55,out);
      }
    }
    out.push({pts:pts,w:w});
  }
  function strike(){
    boltPaths = [];
    makeBolt(W*(0.1+Math.random()*0.8), -10, (Math.random()-0.5)*0.4, H*(0.55+Math.random()*0.3), 3.2, boltPaths);
    boltLife = 1;
    var seq = [0.85,0.15,0.6,0.1,0.25,0];
    var i = 0;
    (function step(){
      flash.style.opacity = seq[i];
      i++;
      if(i < seq.length) setTimeout(step, 55 + Math.random()*60);
    })();
    setTimeout(strike, 5500 + Math.random()*9000);
  }
  setTimeout(strike, 3500);
  function drawBolt(dt){
    bc.clearRect(0,0,W,H);
    if(boltLife <= 0) return;
    boltLife -= dt*3.2;
    var a = Math.max(0, boltLife);
    bc.lineJoin = 'round'; bc.lineCap = 'round';
    boltPaths.forEach(function(p){
      bc.beginPath();
      p.pts.forEach(function(q,i){ i ? bc.lineTo(q[0],q[1]) : bc.moveTo(q[0],q[1]); });
      bc.strokeStyle = 'rgba(255,255,255,' + (a*0.35) + ')'; bc.lineWidth = p.w*5; bc.stroke();
      bc.strokeStyle = 'rgba(255,255,255,' + a + ')'; bc.lineWidth = p.w; bc.stroke();
    });
  }

  /* ---------- Loop ---------- */
  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05,(now-last)/1000); last = now;
    drawBolt(dt); drawBats(dt, now/1000); drawRain(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
